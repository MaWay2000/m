name: Release signed Firefox beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare extension package
        shell: bash
        run: |
          mkdir -p dist
          cp manifest.json dist/manifest.json
          cp -R src dist/src

      - name: Validate extension
        run: npx --yes web-ext@10.7.0 lint --source-dir dist --self-hosted

      - name: Sign unlisted beta through AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          npx --yes web-ext@10.7.0 sign \
            --source-dir dist \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --timeout 900000 \
            --approval-timeout 900000
          signed_xpi="$(find signed -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          if [ -z "$signed_xpi" ]; then
            echo "AMO did not return a signed XPI." >&2
            exit 1
          fi
          mv "$signed_xpi" "codex-autorun-${{ steps.version.outputs.version }}.xpi"

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset="codex-autorun-${{ steps.version.outputs.version }}.xpi"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "codex-autorun ${{ steps.version.outputs.version }} beta" \
              --generate-notes \
              --prerelease
          fi

      - name: Publish Firefox update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          node - <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const updateManifest = {
            addons: {
              "codex-autorun@maway2000.github.io": {
                updates: [
                  {
                    version,
                    update_link: `https://github.com/MaWay2000/m/releases/download/v${version}/codex-autorun-${version}.xpi`,
                  },
                ],
              },
            },
          };
          fs.writeFileSync("updates.json", `${JSON.stringify(updateManifest, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if ! git diff --cached --quiet; then
            git commit -m "updated Firefox beta update manifest"
            git push origin main
          fi
